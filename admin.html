<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Управление товарами — Оптимолл Дисконт</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#15171b;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:700px;margin:auto;padding:18px}.panel{background:white;border:1px solid #e1e4e8;border-radius:18px;padding:18px;margin:14px 0}h1{font-size:23px;margin:6px 0}h2{font-size:18px;margin:0 0 12px}.muted{color:#68707b;font-size:13px}.field{display:block;width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ccd1d8;border-radius:11px;font:inherit;background:white}.btn{border:0;border-radius:11px;padding:12px 14px;font:inherit;font-weight:700;background:#111827;color:white;cursor:pointer}.btn.light{background:#eef0f3;color:#15171b}.btn.danger{background:#a82020}.actions{display:flex;gap:8px;flex-wrap:wrap}.item{border-top:1px solid #e6e8ec;padding:13px 0}.item strong{display:block}.status{margin-top:10px;font-size:14px}.hidden{display:none!important}label{font-size:13px;font-weight:650}
</style>
</head><body><main class="wrap">
<h1>ОПТИМОЛЛ ДИСКОНТ</h1><div class="muted">Управление каталогом</div>
<section id="login" class="panel"><h2>Вход администратора</h2><p class="muted">Войди под своим пользователем Supabase.</p><label>Email</label><input id="email" class="field" type="email" autocomplete="username" placeholder="Email аккаунта"><label>Пароль</label><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Пароль"><button id="loginBtn" class="btn">Войти</button><div id="loginStatus" class="status"></div></section>
<section id="manager" class="hidden">
<div class="panel"><div class="actions" style="justify-content:space-between;align-items:center"><h2>Товары</h2><button id="logoutBtn" class="btn light">Выйти</button></div><p class="muted">Изменения сохраняются в каталоге магазина.</p><div id="products"></div></div>
<div class="panel"><h2 id="formTitle">Добавить товар</h2><form id="productForm">
<input id="productId" type="hidden">
<label>Название</label><input id="name" class="field" required maxlength="160">
<label>Бренд</label><input id="brand" class="field" maxlength="100">
<label>Категория и подкатегория</label><select id="category" class="field" required><optgroup label="Оправы"><option value="Оправы — Универсальные">Универсальные</option><option value="Оправы — Женские">Женские</option><option value="Оправы — Детские">Детские</option></optgroup><optgroup label="Линзы"><option value="Линзы — Корригирующие">Корригирующие</option><option value="Линзы — Фотохромные">Фотохромные</option><option value="Линзы — Прогрессивные">Прогрессивные</option><option value="Линзы — Бифокальные">Бифокальные</option><option value="Линзы — Минеральное стекло">Минеральное стекло</option><option value="Линзы — Имиджевые и солнцезащитные">Имиджевые и солнцезащитные</option></optgroup><optgroup label="Работы"><option value="Работы — Сборка очков">Сборка очков</option><option value="Работы — Ремонт">Ремонт</option></optgroup></select>
<label>Цена, ₽</label><input id="price" class="field" type="number" min="0" step="1" required>
<label>Старая цена, ₽ (необязательно)</label><input id="old_price" class="field" type="number" min="0" step="1">
<label>Фотография товара (можно выбрать с телефона)</label><input id="photoFile" class="field" type="file" accept="image/jpeg,image/png,image/webp"><div id="photoPreview" class="muted"></div><label>Или ссылка на фото (необязательно)</label><input id="photo" class="field" type="url" placeholder="https://...">
<div class="actions"><button class="btn" type="submit">Сохранить товар</button><button id="cancelBtn" class="btn light" type="button">Очистить форму</button></div><div id="formStatus" class="status"></div>
</form></div>
</section>
<div class="muted"><a href="/">Вернуться в магазин</a></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://xyleolabcmkepwdycrxe.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_kIsCb4TRetETGieV_Jlh8g_XTbjMac8";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
const PHOTO_BUCKET="product-photos";
function status(id,msg){$(id).textContent=msg}
function showManager(yes){$("login").classList.toggle("hidden",yes);$("manager").classList.toggle("hidden",!yes)}
async function checkSession(){const {data}=await db.auth.getSession();if(data.session){showManager(true);await loadProducts()}}
$("loginBtn").onclick=async()=>{status("loginStatus","Входим…");const {error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error){status("loginStatus","Не удалось войти. Проверь email и пароль.");return}status("loginStatus","");showManager(true);await loadProducts()};
$("logoutBtn").onclick=async()=>{await db.auth.signOut();showManager(false)};
async function loadProducts(){const box=$("products");box.textContent="Загрузка…";const {data,error}=await db.from("products").select("id,name,brand,category,price,old_price,photo").order("id");if(error){box.textContent="Не удалось загрузить товары. Проверь правила доступа Supabase.";return}box.innerHTML="";if(!data.length){box.textContent="Товаров пока нет.";return}for(const p of data){const div=document.createElement("div");div.className="item";if(p.photo){const img=document.createElement("img");img.src=p.photo;img.alt="Фото товара";img.style.cssText="width:84px;height:84px;object-fit:cover;border-radius:10px;margin-bottom:8px";div.append(img)}const title=document.createElement("strong");title.textContent=p.name;const meta=document.createElement("div");meta.className="muted";meta.textContent=(p.category||"")+(p.brand?" · "+p.brand:"")+" · "+Number(p.price||0).toLocaleString("ru-RU")+" ₽";const actions=document.createElement("div");actions.className="actions";actions.style.marginTop="8px";const edit=document.createElement("button");edit.className="btn light";edit.textContent="Изменить";edit.onclick=()=>editProduct(p);const del=document.createElement("button");del.className="btn danger";del.textContent="Удалить";del.onclick=()=>deleteProduct(p);actions.append(edit,del);div.append(title,meta,actions);box.append(div)}}
function editProduct(p){$("formTitle").textContent="Изменить товар";$("productId").value=p.id;$("name").value=p.name||"";$("brand").value=p.brand||"";$("category").value=p.category||"Оправы — Универсальные";$("price").value=p.price??"";$("old_price").value=p.old_price??"";$("photo").value=p.photo||"";$("photoFile").value="";$("photoPreview").textContent="";status("formStatus","");window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"})}
$("cancelBtn").onclick=()=>{$("productForm").reset();$("productId").value="";$("formTitle").textContent="Добавить товар";$("photoPreview").textContent="";status("formStatus","")};
$("photoFile").onchange=()=>{const f=$("photoFile").files[0];$("photoPreview").textContent=f?"Выбрано: "+f.name+" ("+Math.round(f.size/1024)+" КБ)":""};\n$("productForm").onsubmit=async e=>{e.preventDefault();status("formStatus","Сохраняем…");const payload={name:$("name").value.trim(),brand:$("brand").value.trim()||null,category:$("category").value,price:Number($("price").value),old_price:$("old_price").value===""?null:Number($("old_price").value),photo:$("photo").value.trim()||null};const file=$("photoFile").files[0];if(file){if(file.size>5*1024*1024){status("formStatus","Фото слишком большое. Максимум 5 МБ.");return}if(!["image/jpeg","image/png","image/webp"].includes(file.type)){status("formStatus","Выбери JPG, PNG или WEBP.");return}status("formStatus","Загружаем фотографию…");const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const path="catalog/"+Date.now()+"_"+safeName;const {error:uploadError}=await db.storage.from(PHOTO_BUCKET).upload(path,file,{cacheControl:"3600",upsert:false,contentType:file.type});if(uploadError){status("formStatus","Не удалось загрузить фото. Проверь вход и права хранилища.");return}payload.photo=db.storage.from(PHOTO_BUCKET).getPublicUrl(path).data.publicUrl;}let result;if($("productId").value){result=await db.from("products").update(payload).eq("id",Number($("productId").value))}else{const {data:ids,error:readError}=await db.from("products").select("id").order("id",{ascending:false}).limit(1);if(readError){status("formStatus","Не удалось получить следующий номер товара.");return}payload.id=(ids&&ids.length?Number(ids[0].id):0)+1;result=await db.from("products").insert(payload)}if(result.error){status("formStatus","Ошибка сохранения. Проверь, что SQL-политики выполнены и вход выполнен.");return}status("formStatus","Сохранено!");$("productForm").reset();$("productId").value="";$("formTitle").textContent="Добавить товар";$("photoPreview").textContent="";await loadProducts()};
async function deleteProduct(p){if(!confirm("Удалить товар «"+p.name+"»?"))return;const {error}=await db.from("products").delete().eq("id",p.id);if(error){alert("Не удалось удалить товар. Проверь права доступа.");return}await loadProducts()}
checkSession();
</script></body></html>
