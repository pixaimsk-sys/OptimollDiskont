name: Enable Telegram WebApp API

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Telegram WebApp script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          tag = '<script src="https://telegram.org/js/telegram-web-app.js"></script>'
          if tag not in s:
              marker = '<script>\nconst ORDER_WEBHOOK='
              if marker not in s:
                  raise SystemExit("marker not found")
              s = s.replace(marker, tag + '\n<script>\nconst ORDER_WEBHOOK=', 1)
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Подключить Telegram WebApp API"
          git push
