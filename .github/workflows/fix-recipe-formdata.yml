name: Fix recipe upload transport

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix FormData
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old="const tg=getTelegramUser();const telegramUser=tg.username?('@'+tg.username):([tg.first_name,tg.last_name].filter(Boolean).join(' ')||(tg.id?'Telegram ID: '+tg.id:''));const data=new URLSearchParams();"
          new="const tg=getTelegramUser();const telegramUser=tg.username?('@'+tg.username):([tg.first_name,tg.last_name].filter(Boolean).join(' ')||(tg.id?'Telegram ID: '+tg.id:''));const data=new FormData();"
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Исправить отправку файла рецепта"
          git push
